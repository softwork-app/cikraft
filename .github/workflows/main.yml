name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read

    env:
      ORG_GRADLE_PROJECT_KDGPUsername: ${{ github.actor }}
      ORG_GRADLE_PROJECT_KDGPPassword: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      - name: Build with Gradle
        run: ./gradlew build :generator:integrationTest koverXmlReport koverCoberturaXmlReport

      - name: Detekt
        run: ./gradlew :mergeDetektSarif
        if: always()

      - name: Upload SARIF to Github using the upload-sarif action
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        if: always()
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

      - name: Create baseline to upload suppressed code-smells to GitHub
        run: ./gradlew deleteDetektBaseline :mergeDetektSarif -PignoreDetektFailures=true
      - name: Upload detekt baseline to Github
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detektBaseline

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/reports/kover/cobertura.xml
          archive: false

  upload-coverage:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: read
      code-quality: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cobertura.xml

      - uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1
        with:
          file: cobertura.xml
          language: Java
          label: code-coverage/kover
